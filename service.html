<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service — Yasmine Bassil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:ital,wght@0,400;0,500;1,400&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FCFAF8;
            --bg-cream-dark: #F1EFEC;
            --text-charcoal: #2B2224;
            --text-muted: #5E5557;
            --accent-terracotta: #6E3358;
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, sans-serif;
            --font-arabic: 'Noto Sans Arabic', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body { font-family: var(--font-body); background-color: var(--bg-cream); color: var(--text-charcoal); line-height: 1.6; min-height: 100vh; }
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1.5rem 3rem; display: flex; justify-content: space-between; align-items: center; background: var(--bg-cream); }
        .logo { font-family: 'Fraunces', var(--font-display); font-optical-sizing: auto; font-variation-settings: 'SOFT' 45, 'WONK' 1; font-size: 1.5rem; font-weight: 500; color: var(--text-charcoal); text-decoration: none; }
        .nav-links { display: flex; gap: 2rem; align-items: center; list-style: none; }
        /* the menu is set in the wordmark's typeface; the current page gets a mulberry underline */
        .nav-links a { font-family: 'Fraunces', var(--font-display); font-optical-sizing: auto; font-variation-settings: 'SOFT' 45, 'WONK' 1; font-size: 1.05rem; font-weight: 500; color: var(--text-muted); text-decoration: none; padding-bottom: 2px; border-bottom: 2px solid transparent; transition: color 0.3s ease; }
        .nav-links a:hover { color: #6E3358; }
        .nav-links a.active { color: #44181D; border-bottom-color: #6E3358; }
        .nav-links a.nav-past { opacity: 0.45; }
        .nav-links a.nav-past:hover { opacity: 0.7; }
        .lang-toggle { font-family: var(--font-arabic); font-size: 1rem; padding: 0.3rem 0.6rem; border: 1px solid var(--bg-cream-dark); border-radius: 4px; transition: all 0.3s ease; }
        .lang-toggle:hover { border-color: var(--accent-terracotta); color: var(--accent-terracotta); }
        .mobile-nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 0.5rem; }
        .mobile-nav-toggle span { display: block; width: 24px; height: 2px; background: var(--text-charcoal); margin: 5px 0; }
        @media (max-width: 900px) { nav { padding: 1rem 1.5rem; } .nav-links { display: none; } .mobile-nav-toggle { display: block; } }
        .coming-soon { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem; }
        .coming-soon h1 { font-family: var(--font-display); font-size: 2.5rem; font-weight: 500; margin-bottom: 0.75rem; }
        .coming-soon p { color: var(--text-muted); font-size: 1rem; }
        footer { text-align: center; padding: 3rem 2rem 2rem; color: var(--text-muted); font-size: 0.9rem; border-top: 1px solid var(--bg-cream-dark); }
        /* the menu tightens on narrower screens before it folds into the phone menu */
        .logo { white-space: nowrap; }
        @media (max-width: 1100px) { .nav-links { gap: 1.3rem; } }
        @media (min-width: 901px) and (max-width: 990px) { nav { padding-left: 2rem; padding-right: 2rem; } .nav-links { gap: 1rem; } }
    </style>
</head>
<body>
    <nav>

            <li><a href="music.html">creative</a></li>
            <li><a href="/defense" class="nav-past">defense</a></li>
        </ul>
        <button class="mobile-nav-toggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
    </nav>
    <main class="coming-soon">
        <h1>Coming Soon</h1>
        <p>This page is being updated. Check back soon!</p>
    </main>
    <footer>&copy; 2026 Yasmine Bassil</footer>
</body>
</html>
