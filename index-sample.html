    <style>
        /* Sample: page background matched to the adjusted photo's sky */
        :root { --paper: #FCFAF8; }

        /* ---------- Page chrome: nav ---------- */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.4s ease, box-shadow 0.4s ease, padding 0.3s ease;
        }
        nav.scrolled {
            background-color: var(--paper);
            box-shadow: 0 1px 0 var(--rule-soft);
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .logo {
            font-family: 'Fraunces', var(--display);
            font-optical-sizing: auto;
            font-variation-settings: 'SOFT' 45, 'WONK' 1;
            font-size: 1.5rem;
            font-weight: 500;
            color: #fff;
            text-decoration: none;
            transition: color 0.4s ease;
        }
        nav.scrolled .logo { color: var(--ink); }
        .nav-links { display: flex; gap: 2rem; align-items: center; list-style: none; }
        .nav-links a {
            font-family: var(--meta);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .nav-links a:hover { color: var(--purple); }
        .nav-links a.active { color: var(--ink); }
        .nav-links a.nav-past { opacity: 0.45; }
        .nav-links a.nav-past:hover { opacity: 0.7; }
        .mobile-nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 0.5rem; }
        .mobile-nav-toggle span { display: block; width: 24px; height: 2px; background: var(--ink); margin: 5px 0; }

        .hero-content {
            position: relative;
            z-index: 50;
            max-width: 520px;
            padding: 6rem 4rem 3rem 2rem;
            margin-right: 5%;
            text-align: center;
        }
        .hero-greeting {
            font-family: var(--display);
            font-size: 1.3rem;
            font-style: italic;
            color: var(--terracotta);
            margin-bottom: 0.75rem;
        }
        /* ---------- Wordmark: the name set as a mark, phd as its suffix ---------- */
        .hero-name {
            width: fit-content;          /* so the rule below matches the name, not the column */
            margin: 0 auto 1rem;
        }
        .wordmark {
            display: block;
            font-family: 'Fraunces', var(--display);
            font-optical-sizing: auto;
            font-variation-settings: 'SOFT' 45, 'WONK' 1;
            font-size: clamp(3.25rem, 7.5vw, 5.75rem);
            font-weight: 600;
            line-height: 0.86;
            letter-spacing: -0.03em;
            white-space: nowrap;
            text-align: left;            /* the mark keeps its stagger; it centres as a unit */
        }
        .wm-line { display: block; }
        /* nudge 'bassil' clear of the descender on 'yasmine'; em-based so it scales */
        .wm-line + .wm-line { margin-left: 0.34em; }
        /* phd sits on bassil's line: same face, a third the size, in purple */
        .wm-phd {
            font-size: 0.34em;
            letter-spacing: 0.02em;
            margin-left: 0.18em;
            color: var(--purple);
            vertical-align: baseline;
        }

        .hero-title { font-size: 1.15rem; color: var(--muted); margin-bottom: 1.25rem; white-space: nowrap; }
        /* credentials read as metadata, matching the nav and the phd suffix */
        .hero-tagline {
            font-family: var(--meta);
            font-size: 0.82rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--olive);
            line-height: 1.7;
            white-space: nowrap;
        }
        .hero-links { margin-top: 2rem; display: flex; justify-content: center; gap: 1.5rem; }
        .hero-links a, .email-toggle {
            font-family: var(--meta);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .hero-links a:hover, .email-toggle:hover { color: var(--terracotta); }
        .hero-links svg { width: 10px; height: 10px; }
        .email-wrapper { position: relative; }
        .email-box {
            display: none;
            position: absolute;
            top: 100%; left: 51%;
            transform: translateX(-50%);
            margin-top: 0.5rem;
            align-items: center;
            gap: 0.5rem;
            background: rgba(107, 91, 142, 0.1);
            border: 1px solid rgba(107, 91, 142, 0.2);
            border-radius: 20px;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            color: var(--ink);
            white-space: nowrap;
        }
        .email-box.show { display: flex; }
        .copy-btn { background: none; border: none; cursor: pointer; color: var(--olive); padding: 0.2rem; display: flex; align-items: center; }
        .copy-btn:hover { opacity: 0.7; }

        footer {
            position: absolute;
            left: 0; right: 0; bottom: 1.25rem;
            z-index: 60;
            text-align: center;
            font-family: var(--meta);
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: rgba(254, 251, 253, 0.65);
            pointer-events: none;
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 900px) {
            nav { padding: 1rem 1.5rem; }
            .nav-links { display: none; }
            .nav-links.open {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
                position: absolute;
                top: 100%; left: 0; right: 0;
                background: var(--paper);
